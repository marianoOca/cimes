# Self-hosted Chatwoot (03-crm §1): Rails + PostgreSQL + Redis.
# Runs alongside the backend on the VPS if sized ~2 GB+ RAM, else a separate
# instance. Backend keeps its own SQLite — the Chatwoot API is the only coupling.
# Usage: cp .env.example .env && docker compose up -d
#        First boot: docker compose run --rm rails bundle exec rails db:chatwoot_prepare
services:
  rails:
    image: chatwoot/chatwoot:latest
    env_file: .env
    depends_on:
      - postgres
      - redis
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - chatwoot_storage:/app/storage
    restart: unless-stopped
    entrypoint: docker/entrypoints/rails.sh
    command: ["bundle", "exec", "rails", "s", "-p", "3000", "-b", "0.0.0.0"]

  sidekiq:
    image: chatwoot/chatwoot:latest
    env_file: .env
    depends_on:
      - postgres
      - redis
    volumes:
      - chatwoot_storage:/app/storage
    restart: unless-stopped
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: chatwoot
      POSTGRES_USER: chatwoot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - chatwoot_pg:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - chatwoot_redis:/data
    restart: unless-stopped

volumes:
  chatwoot_storage:
  chatwoot_pg:
  chatwoot_redis:
